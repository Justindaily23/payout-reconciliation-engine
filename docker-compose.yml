services:
  postgres:
    image: postgres:17
    container_name: payout_engine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payout_engine
      POSTGRES_USER: payout_user
      POSTGRES_PASSWORD: payout_engine_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: